<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DevQuest — Software Engineer Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1720; --panel:#16212c; --panel2:#1d2b38; --line:#2a3b4b;
  --text:#eef4f8; --mute:#8ea3b5;
  --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --blue-d:#1899d6;
  --red:#ff4b4b; --red-d:#ea2b2b; --gold:#ffc800; --gold-d:#e5a500;
  --purple:#ce82ff; --orange:#ff9600;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;font-weight:700}
button{font-family:inherit;cursor:pointer;border:none}
code,pre,.mono{font-family:"JetBrains Mono",monospace}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:6px;font-weight:900;font-size:16px}
.stat svg{width:22px;height:22px}
.stat.streak{color:var(--orange)} .stat.xp{color:var(--gold)} .stat.hearts{color:var(--red)} .stat.lvl{color:var(--blue)}
.stat.off{color:#4b5d6c}

main{flex:1;padding-bottom:90px}
.view{display:none}.view.on{display:block}

/* bottom nav */
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--bg);border-top:2px solid var(--line);display:flex;z-index:30}
nav.bottom button{flex:1;background:none;color:var(--mute);padding:10px 0 12px;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.3px}
nav.bottom button svg{width:26px;height:26px}
nav.bottom button.on{color:var(--blue)}
nav.bottom button.on .navic{background:rgba(28,176,246,.15);border:2px solid var(--blue)}
.navic{border-radius:12px;padding:3px 10px;border:2px solid transparent}

/* daily card */
.daily{margin:16px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center}
.ring{width:58px;height:58px;flex:none}
.daily h3{margin:0 0 2px;font-size:16px}
.daily p{margin:0;color:var(--mute);font-size:13px}

/* unit banner */
.unit{margin:22px 16px 6px;border-radius:16px;padding:14px 16px;color:#fff;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.unit .ph{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.85;font-weight:900}
.unit h2{margin:2px 0 4px;font-size:20px;font-weight:900}
.unit p{margin:0;font-size:13px;opacity:.95;font-weight:700}
.unit .guide{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:900}

/* path */
.path{position:relative;padding:52px 0 26px;display:flex;flex-direction:column;align-items:center;gap:18px}
.node{position:relative;width:72px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.node:active{transform:translateY(4px)}
.node svg{width:34px;height:34px}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.cur{background:var(--green);box-shadow:0 7px 0 var(--green-d)}
.node.lock{background:#37464f;box-shadow:0 7px 0 #27333b}
.node.build.cur{background:var(--purple);box-shadow:0 7px 0 #a568cc}
.node.build{border-radius:20px}
.node .lbl{position:absolute;top:76px;white-space:nowrap;font-size:12px;color:var(--mute);font-weight:800;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.node.cur .lbl{color:var(--text)}
.startbub{position:absolute;top:-44px;background:#fff;color:var(--green);font-weight:900;padding:7px 12px;border-radius:12px;border:2px solid var(--line);font-size:14px;animation:bob 1.2s ease-in-out infinite;white-space:nowrap}
.startbub:after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.node.build .startbub{color:#a568cc}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mascot-side{position:absolute;width:90px;opacity:.95}

/* buttons */
.btn{display:block;width:100%;padding:14px;border-radius:16px;font-size:16px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 #a568cc}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:none;border:2px solid var(--line)}
.btn:disabled{background:#37464f;color:#6a7d8b;box-shadow:0 5px 0 #27333b;cursor:default}

/* sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px 26px;max-height:88vh;overflow:auto;border-top:2px solid var(--line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:900}
.sheet .sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.sheet ul{padding-left:20px;margin:8px 0 14px}
.sheet li{margin:6px 0;font-size:14px;line-height:1.45}

/* lesson screen */
#lesson{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
#lesson.on{display:flex}
.lwrap{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lhead .x{background:none;color:var(--mute);font-size:26px;line-height:1;padding:0 4px}
.pbar{flex:1;height:16px;background:#37464f;border-radius:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .3s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.lbody{flex:1;overflow:auto;padding:8px 18px 20px}
.lfoot{padding:14px 16px 20px;border-top:2px solid var(--line)}
.lfoot.good{background:#1c3311;border-top-color:#2b5216}
.lfoot.bad{background:#3a1717;border-top-color:#5c2323}
.fbtitle{font-size:20px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.lfoot.good .fbtitle{color:var(--green)} .lfoot.bad .fbtitle{color:var(--red)}
.fbtext{font-size:14px;color:#d6e2ea;margin-bottom:12px;line-height:1.45}

.qtype{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--purple);font-weight:900;margin:6px 0 6px}
.qtitle{font-size:21px;font-weight:900;margin:0 0 16px;line-height:1.3}
pre.code{background:#0a1117;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.55;overflow:auto;color:#cfe3f1;margin:0 0 16px;white-space:pre}
pre.code .bl{background:rgba(28,176,246,.2);border-bottom:2px dashed var(--blue);color:var(--blue);padding:0 4px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--panel);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:13px 14px;color:var(--text);font-size:15px;font-weight:800;text-align:left;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute)}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.12);color:#bfe9ff}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:rgba(88,204,2,.14)}
.opt.wrong{border-color:var(--red);background:rgba(255,75,75,.14)}
.opt code{font-size:13px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 12px;color:var(--text);font-size:14px;font-weight:800}
.tile.used{visibility:hidden}
.answerrow{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;margin-bottom:18px;display:flex;flex-direction:column;gap:8px}
.answerrow .tile{text-align:left}
.answerrow .n{color:var(--blue);margin-right:6px}

/* learn card */
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:20px;font-weight:900}
.card p{margin:0 0 10px;font-size:15px;line-height:1.55;color:#d6e2ea;font-weight:600}
.card p b{color:#fff}
.card .tip{background:rgba(206,130,255,.1);border:2px solid rgba(206,130,255,.35);border-radius:12px;padding:10px 12px;font-size:13px;color:#ead4ff;margin-top:6px}
.mentorrow{display:flex;gap:12px;align-items:flex-end;margin-bottom:12px}
.mentorrow svg{width:64px;flex:none}
.bubble{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.4;position:relative}

/* build */
.mission{background:linear-gradient(135deg,#2d1d44,#1d2b38);border:2px solid #5b3d80;border-radius:18px;padding:16px;margin-bottom:14px}
.mission h3{margin:0 0 6px;font-size:20px}
.mission p{margin:0 0 8px;font-size:14px;line-height:1.5;color:#e3d6f3;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:14px;line-height:1.4;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--green);flex:none;margin-top:1px}
textarea{width:100%;min-height:150px;background:#0a1117;border:2px solid var(--line);border-radius:14px;color:#cfe3f1;padding:12px;font-family:"JetBrains Mono",monospace;font-size:13px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--blue)}
.review{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.55;margin-top:12px;font-weight:600}
.review pre{background:#0a1117;padding:10px;border-radius:10px;overflow:auto;font-size:12px}

/* end screen */
.endbox{text-align:center;padding:30px 10px}
.endbox h1{font-size:28px;color:var(--gold);margin:10px 0 18px;font-weight:900}
.endstats{display:flex;gap:12px;justify-content:center;margin-bottom:10px}
.es{border:2px solid;border-radius:16px;overflow:hidden;min-width:100px}
.es .t{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#0f1720;padding:5px;font-weight:900}
.es .v{font-size:22px;padding:12px 6px;font-weight:900}

/* roadmap */
.sec{padding:16px}
.sec h1{font-size:24px;margin:4px 0 4px;font-weight:900}
.sec .lead{color:var(--mute);font-size:14px;margin:0 0 16px;line-height:1.45}
.phase{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.phase .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.phase .wk{font-size:12px;color:var(--mute);font-weight:900;letter-spacing:1px;text-transform:uppercase}
.phase h3{margin:2px 0 8px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:12px;background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800}
.phase p{font-size:13px;color:#c8d6e0;margin:0;line-height:1.5;font-weight:600}
.mini{height:10px;background:#37464f;border-radius:6px;overflow:hidden;margin-top:10px}
.mini i{display:block;height:100%;background:var(--green)}
.res a{display:block;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--text);text-decoration:none;font-size:14px}
.res a span{display:block;color:var(--mute);font-size:12px;font-weight:600;margin-top:2px}

/* mentor chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:0 16px 10px}
.msg{max-width:88%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.5;font-weight:600;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:2px solid var(--line);border-bottom-left-radius:4px}
.msg.ai pre{background:#0a1117;padding:10px;border-radius:10px;overflow:auto;font-size:12px;white-space:pre}
.msg code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;font-size:12.5px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.quick button{flex:none;background:var(--panel);border:2px solid var(--line);color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800}
.composer{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--bg);padding:10px 12px;display:flex;gap:8px;border-top:2px solid var(--line)}
.composer input{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:14px;color:var(--text);padding:12px;font-family:inherit;font-size:15px;font-weight:700}
.composer button{background:var(--blue);color:#fff;border-radius:14px;padding:0 16px;font-weight:900;box-shadow:0 4px 0 var(--blue-d)}
.notice{margin:12px 16px;background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--mute)}

/* profile */
.pcard{display:flex;gap:14px;align-items:center;padding:18px 16px;border-bottom:2px solid var(--line)}
.pcard svg{width:76px}
.pcard h2{margin:0;font-size:22px}
.pcard p{margin:2px 0 0;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.gcell{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.gcell svg{width:26px;height:26px;flex:none}
.gcell b{display:block;font-size:18px}
.gcell span{font-size:12px;color:var(--mute)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 16px}
.badge{border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:11px;color:var(--mute)}
.badge .em{font-size:30px;display:block;filter:grayscale(1);opacity:.35}
.badge.got{border-color:var(--gold);color:var(--text)}
.badge.got .em{filter:none;opacity:1}
.h2s{font-size:18px;padding:6px 16px 0;margin:0}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--panel2);border:2px solid var(--gold);color:var(--gold);padding:10px 16px;border-radius:14px;font-weight:900;z-index:90;display:none;font-size:14px;max-width:90%}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:95}
.sync{font-size:11px;color:var(--mute);text-align:center;padding:4px 16px 16px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DevQuest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="stat lvl" title="Level"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg><span id="sLvl">1</span></div>
    <div class="stat streak" id="streakStat" title="Day streak"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 01-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-7 1-9.5z"/></svg><span id="sStreak">0</span></div>
    <div class="stat xp" title="Total XP"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg><span id="sXp">0</span></div>
    <div class="stat hearts" title="Hearts"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0112 7a4.6 4.6 0 018 2.8C20 15.8 12 21 12 21z"/></svg><span id="sHearts">5</span></div>
  </div>

  <main>
    <section class="view on" id="v-learn"></section>
    <section class="view" id="v-road"></section>
    <section class="view" id="v-mentor"></section>
    <section class="view" id="v-me"></section>
  </main>

  <nav class="bottom">
    <button data-v="learn" class="on"><span class="navic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 7h-3v10h-4v-6h-4v6H6V10H3z"/></svg></span>LEARN</button>
    <button data-v="road"><span class="navic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 20c4 0 4-6 8-6s4 6 8 6M12 14V4M12 4l5 3-5 3"/></svg></span>ROADMAP</button>
    <button data-v="mentor"><span class="navic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v12H8l-4 4z"/></svg></span>MENTOR</button>
    <button data-v="me"><span class="navic"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span>PROFILE</button>
  </nav>
</div>

<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="lesson"><div class="lwrap" id="lwrap"></div></div>
<div class="toast" id="toast"></div>
<canvas id="conf"></canvas>

<script>
/* ============ MASCOT (original robot "Bit") ============ */
function bit(mood){
  const mouth = mood==='sad' ? '<path d="M40 70q10-8 20 0" stroke="#0f1720" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : '<path d="M38 66q12 12 24 0" stroke="#0f1720" stroke-width="4" fill="none" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 100 110"><line x1="50" y1="6" x2="50" y2="20" stroke="#8ea3b5" stroke-width="4"/><circle cx="50" cy="6" r="6" fill="${mood==='sad'?'#ff4b4b':'#ffc800'}"/>
  <rect x="14" y="20" width="72" height="62" rx="20" fill="#1cb0f6"/><rect x="14" y="20" width="72" height="62" rx="20" fill="none" stroke="#1899d6" stroke-width="4"/>
  <rect x="24" y="32" width="52" height="30" rx="12" fill="#e9f7ff"/>
  <circle cx="38" cy="46" r="6" fill="#0f1720"/><circle cx="62" cy="46" r="6" fill="#0f1720"/><circle cx="40" cy="44" r="2" fill="#fff"/><circle cx="64" cy="44" r="2" fill="#fff"/>
  ${mouth}<rect x="6" y="42" width="10" height="20" rx="5" fill="#1899d6"/><rect x="84" y="42" width="10" height="20" rx="5" fill="#1899d6"/>
  <rect x="30" y="84" width="40" height="18" rx="8" fill="#58cc02"/><text x="50" y="98" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="12" fill="#fff">${esc(CONFIG.glyph)}</text></svg>`;
}

/*@@CONTENT_START@@*/
/* ============ CONFIG (topic-specific) ============ */
const CONFIG = {
  id:'devquest', appName:'DevQuest', mascot:'Bit', glyph:'</>', profileTitle:'Future IBMer',
  learner:'a BS Computer Engineering student (Philippines) preparing for an IBM Philippines Consulting OJT as a software engineer. They hold CompTIA Network+, Red Hat Academy Linux and AWS cybersecurity training',
  reviewerRole:'a senior software engineer at a consulting firm',
  capstone:'helpdesk-pro',
  roadTitle:'Your roadmap 🗺️',
  roadIntro:'Target: <b>IBM Philippines Consulting OJT — Software Engineer</b>, plus skills most tech job postings ask for through 2028. ~20 weeks at 1–2 hours/day. One capstone project, <b>helpdesk-pro</b>, grows through every phase.',

{id:'u1',phase:'Phase 1 · Foundations',title:'Git & the Terminal',color:'#58cc02',goal:'Every IBM project lives in Git. Learn to save, branch and collaborate on code.',
lessons:[
 {id:'u1l1',title:'Why version control',cards:[
  {h:'Git = save points for code',p:'<b>Git</b> tracks every change to your files as a <b>commit</b> — a snapshot with a message. If something breaks, you can go back. <b>GitHub</b> (or IBM\'s GitHub Enterprise) hosts the repo so a team can share it.'},
  {h:'The 3 areas',p:'<b>Working directory</b> (your edits) → <b>staging area</b> (<code>git add</code>) → <b>repository</b> (<code>git commit</code>). Staging lets you choose exactly what goes in a commit.',code:'git init\ngit add README.md\ngit commit -m "Add README"\ngit status   # what changed?\ngit log --oneline'},
  {h:'Remote repos',p:'<code>git push</code> sends your commits to the remote. <code>git pull</code> fetches teammates\' commits and merges them. <code>git clone &lt;url&gt;</code> copies a remote repo to your laptop.',tip:'Mentor tip: write commit messages in imperative mood — "Fix login bug", not "fixed stuff". Reviewers notice.'}],
 qs:[
  {t:'mc',q:'Which command moves a change into the staging area?',o:['git commit','git add','git push','git stage-all'],a:1,w:'git add stages changes; git commit then records the staged snapshot.'},
  {t:'mc',q:'What does a commit represent?',o:['A backup of your whole PC','A snapshot of staged changes with a message','A copy of the remote server','A branch'],a:1,w:'A commit is a snapshot of the staged files plus metadata (author, message, parent).'},
  {t:'order',q:'Put the steps to share a new file with your team in order.',items:['git add file.txt','git commit -m "Add file"','git push'],w:'Stage → commit → push.'},
  {t:'fill',q:'Fill in the blank to copy a GitHub repo to your machine.',code:'git ___ https://github.com/ibm/sample.git',o:['pull','clone','init','fetch'],a:1,w:'clone creates a local copy of a remote repository.'},
  {t:'mc',q:'Best commit message?',o:['"stuff"','"Fixed it lol"','"Add input validation to signup form"','"update"'],a:2,w:'Short, specific, imperative. It tells reviewers exactly what changed.'}]},
 {id:'u1l2',title:'Branches & Pull Requests',cards:[
  {h:'Branches keep main safe',p:'A <b>branch</b> is a parallel line of work. You build a feature on <code>feature/login</code> without touching <code>main</code>, which should always be deployable.',code:'git switch -c feature/login\n# ...edit, add, commit...\ngit push -u origin feature/login'},
  {h:'Pull Request (PR)',p:'A <b>PR</b> asks the team to review and merge your branch into main. At IBM-style client projects, PRs need approvals and passing automated tests (CI) before merge.'},
  {h:'Merge conflicts',p:'If two people change the same lines, Git can\'t decide — that\'s a <b>conflict</b>. Git marks it with <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code> / <code>=======</code> / <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>. You edit the file to the correct version, then add and commit.',tip:'Pull from main often. Small PRs = fewer conflicts and faster reviews.'}],
 qs:[
  {t:'mc',q:'Why work on a feature branch instead of main?',o:['It\'s faster to type','It keeps main stable while work is in progress','Git requires it','Branches use less storage'],a:1,w:'main should always be releasable; branches isolate unfinished work.'},
  {t:'fill',q:'Create AND switch to a new branch:',code:'git ___ -c feature/cart',o:['branch','checkout','switch','merge'],a:2,w:'git switch -c creates and switches (git checkout -b does the same, older syntax).'},
  {t:'mc',q:'A merge conflict happens when…',o:['The internet disconnects','Two branches changed the same lines differently','You forget a commit message','A branch has no commits'],a:1,w:'Git can\'t auto-choose between two different edits to the same lines.'},
  {t:'mc',q:'What usually must pass before a PR is merged on a professional team?',o:['Nothing','Code review approval + automated tests (CI)','Manager\'s signature on paper','A meeting'],a:1,w:'Review + CI checks are the standard quality gate.'}]},

{id:'u2',phase:'Phase 1 · Foundations',title:'Java Core',color:'#1cb0f6',goal:'Java is IBM Consulting\'s workhorse language for enterprise apps. Master the basics + OOP.',

  {h:'Strongly typed',p:'In Java every variable has a type declared up front. Primitives: <code>int</code>, <code>double</code>, <code>boolean</code>, <code>char</code>. Objects: <code>String</code>, arrays, your classes.',code:'int age = 21;\ndouble gpa = 1.75;\nboolean enrolled = true;\nString name = "Geo";'},
  {h:'Control flow',p:'<code>if/else</code> for decisions, <code>for</code>/<code>while</code> for loops. Every Java program starts at <code>public static void main(String[] args)</code>.',code:'for (int i = 1; i <= 3; i++) {\n  if (i % 2 == 0) System.out.println(i + " even");\n  else System.out.println(i + " odd");\n}'},
  {h:'== vs .equals()',p:'For objects like String, <code>==</code> compares <b>references</b> (same object in memory), <code>.equals()</code> compares <b>content</b>. This is a classic interview trap.',tip:'Always compare Strings with .equals(). Use "admin".equals(role) to avoid NullPointerException.'}],
 qs:[
  {t:'mc',q:'Which type stores true/false?',o:['int','boolean','String','char'],a:1,w:'boolean holds true or false.'},
  {t:'mc',q:'How should you compare two Strings for equal text?',o:['a == b','a.equals(b)','a = b','compare(a,b)'],a:1,w:'.equals() compares content; == compares references.'},

  {t:'mc',q:'What does this print?',code:'int x = 7;\nSystem.out.println(x % 3);',o:['2','1','0','2.33'],a:1,w:'% is remainder: 7 = 2×3 + 1.'},
  {t:'mc',q:'Which loop runs exactly 5 times?',o:['for(int i=0;i<=5;i++)','for(int i=1;i<5;i++)','for(int i=0;i<5;i++)','for(int i=5;i<0;i++)'],a:2,w:'i = 0,1,2,3,4 → five iterations.'}]},
 {id:'u2l2',title:'Object-Oriented Programming',cards:[
  {h:'Class vs object',p:'A <b>class</b> is a blueprint; an <b>object</b> is an instance built from it with <code>new</code>.',code:'class Ticket {\n  private String title;\n  private String status = "OPEN";\n  Ticket(String title) { this.title = title; }\n  void close() { status = "CLOSED"; }\n  String getStatus() { return status; }\n}\nTicket t = new Ticket("VPN down");'},
  {h:'The 4 pillars',p:'<b>Encapsulation</b> — hide data behind methods (private fields + getters). <b>Inheritance</b> — <code>class Incident extends Ticket</code>. <b>Polymorphism</b> — same method call, different behavior per subclass. <b>Abstraction</b> — expose what, hide how (interfaces, abstract classes).'},
  {h:'Interfaces',p:'An <b>interface</b> is a contract: methods a class promises to implement. Spring Boot (Unit 5) is built on interfaces + dependency injection.',code:'interface Notifier { void send(String msg); }\nclass EmailNotifier implements Notifier {\n  public void send(String msg) { /* ... */ }\n}',tip:'Interviewers LOVE "explain the 4 pillars with an example." Use the Ticket example — it\'s relevant to consulting.'}],
 qs:[

  {t:'fill',q:'Make Incident a subclass of Ticket:',code:'class Incident ___ Ticket { }',o:['implements','extends','inherits','super'],a:1,w:'Classes extend classes; classes implement interfaces.'},
  {t:'mc',q:'Which keyword creates an object?',o:['class','new','this','static'],a:1,w:'new allocates and calls the constructor.'},
  {t:'mc',q:'A Notifier variable holds an EmailNotifier or SmsNotifier, and notifier.send() behaves differently for each. This is…',o:['Encapsulation','Polymorphism','Abstraction only','Overloading'],a:1,w:'Polymorphism: one interface, many implementations.'},
  {t:'order',q:'Order from most abstract to most concrete:',items:['interface Notifier','class EmailNotifier implements Notifier','new EmailNotifier()'],w:'Contract → implementation → instance.'}]},
 {id:'u2l3',title:'Collections & Streams',cards:[
  {h:'The big three',p:'<b>List</b> (ordered, duplicates OK — <code>ArrayList</code>), <b>Set</b> (unique — <code>HashSet</code>), <b>Map</b> (key→value — <code>HashMap</code>). HashMap lookups are O(1) on average.',code:'List<String> names = new ArrayList<>();\nnames.add("Ana");\nMap<String,Integer> stock = new HashMap<>();\nstock.put("soap", 12);\nint s = stock.get("soap");'},
  {h:'Streams',p:'Streams process collections declaratively: <code>filter</code>, <code>map</code>, <code>collect</code>. Modern enterprise Java uses them everywhere.',code:'List<Ticket> open = tickets.stream()\n  .filter(t -> t.getStatus().equals("OPEN"))\n  .toList();'},
  {h:'Exceptions',p:'Errors are thrown as exceptions. Handle what you can with <code>try/catch</code>; let the rest bubble up. Never swallow exceptions silently.',code:'try {\n  int n = Integer.parseInt(input);\n} catch (NumberFormatException e) {\n  System.out.println("Not a number");\n}'}],

 {id:'u5l2',title:'Spring Boot essentials',cards:[

const ALL = []; UNITS.forEach(u=>u.lessons.forEach(l=>{l.unit=u;ALL.push(l)}));

/* ============ STATE ============ */
const KEY=CONFIG.id+'_v1';
document.title=CONFIG.appName;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
let S={xp:0,streak:0,last:null,hearts:5,heartTs:Date.now(),done:{},daily:{d:today(),xp:0},goal:30,perfect:0,builds:{},checks:{},reviews:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}

let DB=null,UID=null,docRef=null,writing=false,pendingWrite=false,syncMsg='Progress saved on this device';
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(docRef){ if(writing){pendingWrite=true;return} writing=true;
    docRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{}).finally(()=>{writing=false;if(pendingWrite){pendingWrite=false;save()}});
  }
}
async function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    DB=db;UID=id;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    if(snap.exists){
      const c=snap.data()||{};
      if((c.xp||0)>=S.xp){S=Object.assign({},S,JSON.parse(JSON.stringify(c)))}
      else{S.done=Object.assign({},c.done||{},S.done)}
    }
    docRef=ref; syncMsg='Progress synced to your account ☁️'; save(); renderAll();
  }catch(e){}
}

function regenHearts(){
  const MS=20*60*1000;
  if(S.hearts>=5){S.heartTs=Date.now();return}
  const n=Math.floor((Date.now()-S.heartTs)/MS);
  if(n>0){S.hearts=Math.min(5,S.hearts+n);S.heartTs+=n*MS}
}
function liveStreak(){ if(!S.last)return 0; const d=dayDiff(S.last,today()); return d<=1?S.streak:0 }
function level(){return Math.floor(S.xp/120)+1}
function addXp(n){
  S.xp+=n; if(S.daily.d!==today())S.daily={d:today(),xp:0}; S.daily.xp+=n;
  const t=today(); if(S.last!==t){ S.streak = (S.last && dayDiff(S.last,t)===1) ? S.streak+1 : 1; S.last=t }
}
const nextIdx=()=>{const i=ALL.findIndex(l=>!S.done[l.id]);return i<0?ALL.length:i};

/* ============ RENDER: TOP ============ */
function renderTop(){
  regenHearts();
  document.getElementById('sXp').textContent=S.xp;
  document.getElementById('sLvl').textContent=level();
  const st=liveStreak();document.getElementById('sStreak').textContent=st;
  document.getElementById('streakStat').classList.toggle('off',!(S.last===today()));
  document.getElementById('sHearts').textContent=S.hearts;
}

function renderLearn(){
  const v=document.getElementById('v-learn');
  const ni=nextIdx();
  const dx=S.daily.d===today()?S.daily.xp:0, pct=Math.min(1,dx/S.goal);
  const C=2*Math.PI*24;
  let h=`<div class="daily"><svg class="ring" viewBox="0 0 58 58"><circle cx="29" cy="29" r="24" stroke="#37464f" stroke-width="7" fill="none"/><circle cx="29" cy="29" r="24" stroke="${pct>=1?'#ffc800':'#58cc02'}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 29 29)"/><text x="29" y="34" text-anchor="middle" fill="#eef4f8" font-size="14" font-weight="900" font-family="Nunito">${Math.round(pct*100)}%</text></svg>
  <div><h3>${pct>=1?'Daily goal crushed! 🔥':'Daily goal: '+S.goal+' XP'}</h3><p>${dx} / ${S.goal} XP today · ${ni>=ALL.length?'Path complete!':'Next: '+ALL[Math.min(ni,ALL.length-1)].title}</p></div></div>`;
  let gi=0;
  UNITS.forEach((u,ui)=>{
    h+=`<div class="unit" style="background:${u.color}"><div class="ph">${u.phase} · Unit ${ui+1}</div><h2>${u.title}</h2><p>${u.goal}</p><button class="guide" onclick="openGuide('${u.id}')">GUIDE</button></div><div class="path">`;
    u.lessons.forEach((l,li)=>{
      const idx=ALL.indexOf(l), done=!!S.done[l.id], cur=idx===ni, lock=idx>ni;
      const off=Math.round(Math.sin((gi++)*0.95)*70);
      const cls=(l.build?'build ':'')+(done?'done':cur?'cur':'lock');
      const ic=done?ICON.done:lock?(l.build?ICON.buildLock:ICON.lock):(l.build?ICON.build:ICON.learn);
      h+=`<button class="node ${cls}" style="transform:translateX(${off}px)" onclick="tapNode('${l.id}')">${cur?`<span class="startbub">${l.build?'BUILD':'START'}</span>`:''}${ic}<span class="lbl">${l.title}</span></button>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="sync">${syncMsg}</div>`;
  v.innerHTML=h;
}

function tapNode(id){
  const l=ALL.find(x=>x.id===id), idx=ALL.indexOf(l), ni=nextIdx();
  if(idx>ni){toast('🔒 Finish the lessons before this one first');return}
  const done=!!S.done[id];
  sheet(`<div class="mentorrow">${bit()}<div class="bubble">${l.build?'Time to build something real! This is portfolio material.':done?'Nice — replay to sharpen it. Replays give half XP.':'Ready? I\'ll teach, then quiz you. Wrong answers come back at the end.'}</div></div>
  <h2>${l.title}</h2><div class="sub">${l.unit.title} · ${l.build?'Build mission · +50 XP':(l.qs.length+' questions · +'+(done?10:20)+' XP')}</div>
  <button class="btn ${l.build?'purple':''}" onclick="closeSheet();${l.build?`openBuild('${id}')`:`startLesson('${id}')`}">${done?'PRACTICE AGAIN':l.build?'OPEN MISSION':'START LESSON'}</button>`);
}

function openGuide(uid){
  const u=UNITS.find(x=>x.id===uid);
  sheet(`<h2>${u.title}</h2><div class="sub">${u.goal}</div><b>You'll learn</b><ul>${u.lessons.filter(l=>!l.build).map(l=>'<li>'+l.title+' — '+l.cards.map(c=>c.h).join(', ')+'</li>').join('')}</ul><b>You'll build</b><ul>${u.lessons.filter(l=>l.build).map(l=>'<li>'+l.mission+'</li>').join('')}</ul><button class="btn blue" onclick="closeSheet()">GOT IT</button>`);
}

/* ============ LESSON ENGINE ============ */
let L=null;
function startLesson(id){
  regenHearts();
  if(S.hearts<=0){
    const mins=Math.ceil((20*60*1000-(Date.now()-S.heartTs))/60000);
    sheet(`<div class="mentorrow">${bit('sad')}<div class="bubble">Out of hearts! Take a breather — or review your notes.</div></div><h2>No hearts left</h2><div class="sub">Next heart in ~${mins} min. Or spend 30 XP to refill all.</div><button class="btn red" ${S.xp<30?'disabled':''} onclick="S.xp-=30;S.hearts=5;save();renderAll();closeSheet();startLesson('${id}')">REFILL FOR 30 XP</button><div style="height:10px"></div><button class="btn ghost" onclick="closeSheet()">LATER</button>`);
    return;
  }
  const l=ALL.find(x=>x.id===id);
  const steps=[...l.cards.map(c=>({k:'card',c})),...l.qs.map(q=>({k:'q',q}))];
  L={l,steps,i:0,total:steps.length,right:0,wrong:0,firstTry:0,sel:null,answered:false,order:[],retry:new Set()};
  document.getElementById('lesson').classList.add('on');
  drawStep();
}
function quitLesson(){
  sheet(`<div class="mentorrow">${bit('sad')}<div class="bubble">Wait, don't go! You'll lose this lesson's progress.</div></div><button class="btn blue" onclick="closeSheet()">KEEP LEARNING</button><div style="height:10px"></div><button class="btn ghost" style="color:var(--red)" onclick="closeSheet();endLessonUI()">END SESSION</button>`);
}
function endLessonUI(){document.getElementById('lesson').classList.remove('on');L=null;renderAll()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function drawStep(){
  const w=document.getElementById('lwrap');
  const st=L.steps[L.i]; const prog=Math.min(100,(L.i/L.steps.length)*100);
  let body='',foot='';
  if(st.k==='card'){
    const c=st.c;
    body=`<div class="qtype">📘 Learn</div><div class="card"><h3>${c.h}</h3>${c.p?`<p>${c.p}</p>`:''}${c.code?`<pre class="code">${esc(c.code)}</pre>`:''}${c.tip?`<div class="tip">💡 ${c.tip}</div>`:''}</div>`;
    foot=`<button class="btn" onclick="nextStep()">CONTINUE</button>`;
  } else {
    const q=st.q; L.sel=null; L.answered=false;
    const label={mc:'Choose the answer',fill:'Fill in the blank',order:'Put in order',tf:'True or false'}[q.t];
    body=`<div class="qtype">${st.retry?'🔁 Mistake review · ':''}${label}</div><h2 class="qtitle">${q.q}</h2>`;
    if(q.code){ let c=esc(q.code); if(q.t==='fill')c=c.replace('___','<span class="bl" id="blank">____</span>'); body+=`<pre class="code">${c}</pre>`}
    if(q.t==='order'){
      L.order=[]; L.pool=shuffle(q.items.map((t,i)=>({t,i})));
      if(L.pool.every((p,k)=>p.i===k)&&L.pool.length>1)L.pool.reverse();
      body+=`<div class="answerrow" id="ans"></div><div class="tiles" id="pool"></div>`;
    } else {
      body+=`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pick(${i})"><span class="k">${i+1}</span><span>${/[<>(){};=]/.test(o)?'<code>'+esc(o)+'</code>':esc(o)}</span></button>`).join('')}</div>`;
    }
    foot=`<button class="btn" id="chk" disabled onclick="check()">CHECK</button>`;
  }
  w.innerHTML=`<div class="lhead"><button class="x" onclick="quitLesson()">✕</button><div class="pbar"><i style="width:${prog}%"></i></div><div class="stat hearts"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0112 7a4.6 4.6 0 018 2.8C20 15.8 12 21 12 21z"/></svg>${S.hearts}</div></div>
  <div class="lbody" id="lbody">${body}</div><div class="lfoot" id="lfoot">${foot}</div>`;
  if(st.k==='q'&&st.q.t==='order')drawOrder();
}
function drawOrder(){
  const ans=document.getElementById('ans'),pool=document.getElementById('pool');
  ans.innerHTML=L.order.map((p,k)=>`<button class="tile" onclick="unOrder(${k})"><span class="n">${k+1}.</span>${esc(p.t)}</button>`).join('')||'<span style="color:var(--mute);font-size:13px;padding:8px 0">Tap tiles below in the right order</span>';
  pool.innerHTML=L.pool.map((p,k)=>`<button class="tile ${L.order.includes(p)?'used':''}" onclick="toOrder(${k})">${esc(p.t)}</button>`).join('');
  const chk=document.getElementById('chk'); if(chk)chk.disabled=L.order.length!==L.pool.length;
}
function toOrder(k){if(L.answered)return;const p=L.pool[k];if(!L.order.includes(p)){L.order.push(p);drawOrder()}}
function unOrder(k){if(L.answered)return;L.order.splice(k,1);drawOrder()}
function pick(i){
  if(L.answered)return; L.sel=i;
  document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));
  const q=L.steps[L.i].q; const bl=document.getElementById('blank'); if(bl)bl.textContent=q.o[i];
  document.getElementById('chk').disabled=false;
}
document.addEventListener('keydown',e=>{
  if(!L)return; const st=L.steps[L.i];
  if(st&&st.k==='q'&&st.q.t!=='order'&&/^[1-4]$/.test(e.key)&&!L.answered){const i=+e.key-1;if(i<st.q.o.length)pick(i)}
  if(e.key==='Enter'){const b=document.querySelector('#lfoot .btn');if(b&&!b.disabled)b.click()}
});
function check(){
  const st=L.steps[L.i],q=st.q; L.answered=true;
  let ok;
  if(q.t==='order') ok=L.order.every((p,k)=>p.i===k);
  else{ ok=L.sel===q.a;
    document.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;if(i===q.a)b.classList.add('right');else if(i===L.sel)b.classList.add('wrong')});
  }
  const f=document.getElementById('lfoot');
  if(ok){ L.right++; if(!st.retry)L.firstTry++;
    f.className='lfoot good';
    f.innerHTML=`<div class="fbtitle">✔ ${['Nice!','Excellent!','Correct!','You got it!','Sharp!'][Math.floor(Math.random()*5)]}</div><div class="fbtext">${q.w}</div><button class="btn" onclick="nextStep()">CONTINUE</button>`;
  } else {
    L.wrong++; if(S.hearts>=5)S.heartTs=Date.now(); S.hearts=Math.max(0,S.hearts-1); save();
    const corr=q.t==='order'?q.items.map((t,k)=>(k+1)+'. '+t).join('<br>'):esc(q.o[q.a]);
    L.steps.push({k:'q',q,retry:true});
    f.className='lfoot bad';
    f.innerHTML=`<div class="fbtitle">✖ Not quite</div><div class="fbtext"><b>Correct answer:</b><br>${corr}<br><br>${q.w}</div><button class="btn red" onclick="nextStep()">${S.hearts<=0?'OUT OF HEARTS':'GOT IT'}</button>`;
    document.querySelector('.lhead .hearts').innerHTML=document.querySelector('.lhead .hearts').innerHTML.replace(/\d+$/,S.hearts);
  }
}
function nextStep(){
  if(S.hearts<=0&&L.steps[L.i].k==='q'&&L.answered&&L.wrong>0){
    const id=L.l.id; endLessonUI(); startLesson(id); return;
  }
  L.i++;
  if(L.i>=L.steps.length)finishLesson(); else drawStep();
}
function finishLesson(){
  const l=L.l, replay=!!S.done[l.id];
  const qn=l.qs.length, acc=Math.round(L.firstTry/qn*100);
  let xp=replay?10:20; if(acc===100)xp+=5;
  const prevLvl=level();
  addXp(xp); S.done[l.id]=true; if(acc===100)S.perfect=(S.perfect||0)+1; save();
  const lvlUp=level()>prevLvl;
  document.getElementById('lwrap').innerHTML=`<div class="lbody"><div class="endbox"><div style="width:140px;margin:0 auto">${bit()}</div><h1>${acc===100?'Perfect lesson!':'Lesson complete!'}</h1>
  <div class="endstats"><div class="es" style="border-color:var(--gold)"><div class="t" style="background:var(--gold)">Total XP</div><div class="v" style="color:var(--gold)">+${xp}</div></div><div class="es" style="border-color:var(--green)"><div class="t" style="background:var(--green)">Accuracy</div><div class="v" style="color:var(--green)">${acc}%</div></div><div class="es" style="border-color:var(--orange)"><div class="t" style="background:var(--orange)">Streak</div><div class="v" style="color:var(--orange)">🔥${liveStreak()}</div></div></div>
  ${lvlUp?`<p style="color:var(--blue);font-size:18px;font-weight:900">⭐ Level up! You're now level ${level()}</p>`:''}</div></div>
  <div class="lfoot"><button class="btn" onclick="endLessonUI()">CONTINUE</button></div>`;
  confetti();
}

/* ============ BUILD MISSIONS ============ */
let SAMPLE=null;
function openBuild(id){
  const l=ALL.find(x=>x.id===id); S.checks[id]=S.checks[id]||[];
  const w=document.getElementById('lwrap'); document.getElementById('lesson').classList.add('on');
  const rv=S.reviews[id];
  w.innerHTML=`<div class="lhead"><button class="x" onclick="endLessonUI()">✕</button><div style="flex:1;font-weight:900">Build mission</div></div>
  <div class="lbody"><div class="mission"><div class="qtype" style="color:#e3c4ff">🛠 ${l.unit.title}</div><h3>${l.title.replace('BUILD: ','')}</h3><p>${l.mission}</p></div>
  <div class="qtype">Checklist</div>${l.steps.map((s,i)=>`<label class="check"><input type="checkbox" ${S.checks[id][i]?'checked':''} onchange="tick('${id}',${i},this.checked)"><span>${s}</span></label>`).join('')}
  <div class="qtype" style="margin-top:16px">Mentor code review</div><p style="font-size:13px;color:var(--mute);margin:0 0 8px;font-weight:600">${l.submit}</p>
  <textarea id="sub" placeholder="Paste here…">${esc(S.builds[id]||'')}</textarea>
  <div style="height:10px"></div><button class="btn blue" id="revBtn" onclick="review('${id}')">${SAMPLE?'GET MENTOR REVIEW':'SAVE SUBMISSION'}</button>
  <div id="revOut">${rv?`<div class="review">${md(rv)}</div>`:''}</div></div>
  <div class="lfoot"><button class="btn purple" id="doneBtn" onclick="completeBuild('${id}')">${S.done[id]?'MISSION COMPLETE ✔':'MARK MISSION COMPLETE'}</button></div>`;
  updDone(id);
}
function tick(id,i,v){S.checks[id][i]=v;save();updDone(id)}
function updDone(id){const l=ALL.find(x=>x.id===id);const b=document.getElementById('doneBtn');if(!b)return;const all=l.steps.every((_,i)=>S.checks[id][i]);b.disabled=!all||!!S.done[id];if(!all&&!S.done[id])b.textContent='TICK ALL STEPS TO COMPLETE'}
function completeBuild(id){
  if(S.done[id])return; const p=level(); addXp(50); S.done[id]=true; save();
  document.getElementById('doneBtn').textContent='MISSION COMPLETE ✔';document.getElementById('doneBtn').disabled=true;
  confetti(); toast('+50 XP · Mission complete!'+(level()>p?' ⭐ Level '+level():''));
}
async function review(id){
  const l=ALL.find(x=>x.id===id), txt=document.getElementById('sub').value.trim();
  S.builds[id]=txt; save();
  if(!SAMPLE){toast('Submission saved');return}
  if(txt.length<20){toast('Paste a bit more for a useful review');return}
  const out=document.getElementById('revOut'),btn=document.getElementById('revBtn');
  btn.disabled=true;btn.textContent='MENTOR IS REVIEWING…';
  out.innerHTML='<div class="review" id="rv">Thinking…</div>';
  const prompt=`You are ${CONFIG.reviewerRole} mentoring ${CONFIG.learner}. Be concise, precise and encouraging, like a good reviewer.

Mission: ${l.title} — ${l.mission.replace(/<[^>]+>/g,'')}
Checklist: ${l.steps.join('; ')}

Student submission:
"""
${txt.slice(0,12000)}
"""

Reply in this format (markdown, under 250 words):
**Score: X/10**
**What's good:** 2-3 bullets
**Fix next:** 2-4 specific bullets, with a short code snippet if it helps
**Interview angle:** one sentence on how to talk about this in an interview.`;
  try{
    const r=await SAMPLE(prompt,{cache:false,onText:({text})=>{const e=document.getElementById('rv');if(e)e.innerHTML=md(text)}});
    S.reviews[id]=r.text; save(); document.getElementById('rv').innerHTML=md(r.text);
  }catch(e){ out.innerHTML=`<div class="review">${e&&e.code==='rate_limited'?'Mentor is busy — try again in a minute.':'Couldn\'t reach the mentor right now. Your submission is saved.'}</div>` }
  btn.disabled=false;btn.textContent='GET MENTOR REVIEW';
}

/* ============ MENTOR CHAT ============ */
let CHAT=[];
function md(t){
  let s=esc(t);
  s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>'<pre>'+c+'</pre>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/^### (.*)$/gm,'<b>$1</b>').replace(/^## (.*)$/gm,'<b>$1</b>').replace(/^[-*] (.*)$/gm,'• $1');
  return s.split(/(<pre>[\s\S]*?<\/pre>)/).map(p=>p.startsWith('<pre>')?p:p.replace(/\n/g,'<br>')).join('');
}
function renderMentor(){
  const v=document.getElementById('v-mentor');
  const ni=nextIdx(), cur=ALL[Math.min(ni,ALL.length-1)];
  if(!SAMPLE){
    v.innerHTML=`<div class="sec"><div class="mentorrow">${bit()}<div class="bubble">Hi! I'm ${CONFIG.mascot}, your mentor. I can answer questions, quiz you and run practice drills.</div></div></div><div class="notice">The live mentor needs this page opened on claude.ai while signed in. You can also ask me anything in your Claude chat — I'll pick up right where your path is: <b>${cur.unit.title} → ${cur.title}</b>.</div>`;
    return;
  }
  if(!document.getElementById('chatbox')){
    v.innerHTML=`<div class="sec" style="padding-bottom:6px"><div class="mentorrow">${bit()}<div class="bubble">I'm ${CONFIG.mascot}, your mentor. Ask me anything, or pick a drill. You're on <b id="curTopic"></b>.</div></div></div>
    <div class="quick" id="quick"></div><div class="chat" id="chatbox"></div><div style="height:80px"></div>
    <form class="composer" id="cform"><input id="cin" placeholder="Ask your mentor…" autocomplete="off"><button>SEND</button></form>`;
    document.getElementById('cform').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('cin');if(i.value.trim()){ask(i.value.trim());i.value=''}});
  }
  document.getElementById('curTopic').textContent=cur.unit.title+' → '+cur.title;
  const qs=CONFIG.quick.map(q=>[q[0],q[1].replace(/\{unit\}/g,cur.unit.title).replace(/\{lesson\}/g,cur.title)]);
  document.getElementById('quick').innerHTML=qs.map((q,i)=>`<button data-i="${i}">${q[0]}</button>`).join('');
  document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>ask(qs[+b.dataset.i][1]));
  drawChat();
}
function drawChat(){
  const box=document.getElementById('chatbox'); if(!box)return;
  box.innerHTML=CHAT.map(m=>`<div class="msg ${m.role==='user'?'me':'ai'}">${m.role==='user'?esc(m.content):md(m.content||'…')}</div>`).join('');
  window.scrollTo(0,document.body.scrollHeight);
}
let asking=false;
async function ask(text){
  if(asking||!SAMPLE)return; asking=true;
  CHAT.push({role:'user',content:text}); CHAT.push({role:'assistant',content:'Thinking…'}); drawChat();
  const ni=nextIdx(), cur=ALL[Math.min(ni,ALL.length-1)];
  const sys=`[Mentor instructions] You are "${CONFIG.mascot}", a concise, precise and friendly mentor inside the Duolingo-style learning app ${CONFIG.appName}. The learner is ${CONFIG.learner}. Current unit: ${cur.unit.title}; next lesson: ${cur.title}. Completed lessons: ${Object.keys(S.done).length}/${ALL.length}. Keep replies short (under 180 words unless asked), use small concrete examples, check understanding with a question when teaching, and say so when you are unsure instead of inventing facts.\n\n`;
  const msgs=CHAT.slice(0,-1).slice(-12).map((m,i)=>({role:m.role,content:m.content}));
  msgs[0]={role:msgs[0].role,content:(msgs[0].role==='user'?sys:'')+msgs[0].content};
  if(msgs[0].role!=='user')msgs.unshift({role:'user',content:sys+'Hi'});
  try{
    const r=await SAMPLE(msgs,{cache:false,onText:({text})=>{CHAT[CHAT.length-1].content=text;drawChat()}});
    CHAT[CHAT.length-1].content=r.text;
  }catch(e){CHAT[CHAT.length-1].content=e&&e.code==='rate_limited'?'I\'m getting a lot of questions — try again in a minute.':'I couldn\'t answer just now. Try again.'}
  asking=false; drawChat();
}

/* ============ UI UTILS ============ */
function sheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('ov').classList.add('on')}
function closeSheet(){document.getElementById('ov').classList.remove('on')}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2400)}
function confetti(){
  const c=document.getElementById('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];
  const P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,s:Math.random()*7+4,c:cols[Math.floor(Math.random()*6)],r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
let VIEW='learn';
document.querySelectorAll('nav.bottom button').forEach(b=>b.onclick=()=>{
  VIEW=b.dataset.v;document.querySelectorAll('nav.bottom button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+VIEW));
  renderAll();window.scrollTo(0,0);
});
function renderAll(){renderTop();if(VIEW==='learn')renderLearn();if(VIEW==='road')renderRoad();if(VIEW==='mentor')renderMentor();if(VIEW==='me')renderMe()}
renderAll();
setInterval(renderTop,60000);
function waitClaude(){return new Promise(res=>{let n=0;(function p(){if(window.claude&&window.claude.use)return res(true);if(++n>40)return res(false);setTimeout(p,150)})()})}
(async()=>{
  if(!(await waitClaude()))return;
  initCloud();
  try{const s=await claude.use('sample');if(s){SAMPLE=s;if(VIEW==='mentor')renderMentor()}}catch(e){}
})();
</script>

/* PWA: offline support when hosted outside claude.ai (GitHub Pages / APK). Harmless elsewhere. */
try{ if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})) } }catch(e){}
</script>
